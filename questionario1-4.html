<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questionário 1 — Unção</title>
  <meta name="description" content="Questionário 1 com 20 questões de Verdadeiro ou Falso.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html"><div class="brand-mark">U</div>Unção • Fixação</a>
      <a class="nav-link" href="index.html">← Escolher outro questionário</a>
    </div>
  </div>

  <main class="quiz-shell">
    <div class="container">
      <img class="hero-banner" src="wide_horizontal_banner_graphic_with_a_clean_modern.png" alt="Unção — Questões de Fixação">

      <div class="quiz-head">
        <div>
          <span class="eyebrow">Questionário 1 de 3</span>
          <h1>Questionário 1</h1>
          <p>20 questões • Verdadeiro ou Falso • explicação imediata após a resposta</p>
        </div>
        <a class="home-btn" href="index.html">Página inicial</a>
      </div>

      <div class="stats">
        <div>
          <div class="stat-label">Questão</div>
          <div class="stat-value"><span id="answered">0</span>/20 respondidas</div>
        </div>
        <div>
          <div class="stat-label">Progresso</div>
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
        </div>
        <div>
          <div class="stat-label">Acertos</div>
          <div class="stat-value"><span id="hits">0</span></div>
        </div>
      </div>

      <div id="quiz"></div>

      <div class="controls">
        <button class="control secondary" id="resetBtn">Refazer questionário</button>
        <button class="control primary" id="finishBtn">Finalizar e ver resultado</button>
      </div>

      <section class="result" id="result"></section>
    </div>
  </main>

  <footer class="footer"><div class="container">RHEMA • Questões de Fixação — Unção</div></footer>

<script>
const questions = [{"n": 1, "q": "No Antigo Testamento, o verbo hebraico mashach podia ser utilizado tanto para o ato comum de passar óleo quanto para o ato sagrado de separar alguém ou algo para Deus.", "a": "V", "e": "Mashach aparece tanto em usos comuns quanto no sentido de consagrar pessoas ou coisas para uma finalidade sagrada."}, {"n": 2, "q": "No Antigo Testamento, o termo mashiach era usado exclusivamente como título para Jesus Cristo.", "a": "F", "e": "Outras pessoas também eram chamadas de ungidas, incluindo Saul, sacerdotes e Ciro. O termo estava relacionado à escolha e separação para uma função."}, {"n": 3, "q": "A ideia bíblica de santidade inclui o conceito de ser separado ou apartado para Deus.", "a": "V", "e": "Tornar algo santo envolve retirá-lo do uso comum e destiná-lo ao uso exclusivo de Deus."}, {"n": 4, "q": "No Novo Testamento, aleiphō e chrio são utilizados sem qualquer diferença entre o uso comum e o uso sagrado da unção.", "a": "F", "e": "Aleiphō está relacionado ao uso cotidiano de óleo, enquanto chrio está ligado à unção sagrada."}, {"n": 5, "q": "Chrisma refere-se à unção recebida que permanece na pessoa.", "a": "V", "e": "Chrisma não descreve apenas o ato de ungir, mas a unção recebida e presente naquele que foi ungido."}, {"n": 6, "q": "A unção possui dois propósitos fundamentais: separar para Deus e capacitar para uma missão.", "a": "V", "e": "A unção envolve consagração e também capacitação divina para cumprir determinada função."}, {"n": 7, "q": "A separação para Deus é suficiente por si mesma, não sendo necessária capacitação para realizar a missão recebida.", "a": "F", "e": "Separação e capacitação fazem parte da unção. A pessoa é separada para um propósito e habilitada para cumpri-lo."}, {"n": 8, "q": "Reis, sacerdotes, profetas e outros ungidos do Antigo Testamento apontavam para Cristo.", "a": "V", "e": "As diferentes funções exercidas pelos ungidos preparavam o caminho para Cristo, o Ungido por excelência."}, {"n": 9, "q": "O óleo santo descrito em Êxodo 30 possuía mirra, canela aromática, cálamo aromático, cássia e azeite de oliva.", "a": "V", "e": "Esses ingredientes formavam a composição determinada para o óleo santo da unção."}, {"n": 10, "q": "Mirra, canela, cálamo e cássia eram utilizados exatamente na mesma quantidade na preparação do óleo santo.", "a": "F", "e": "Mirra e cássia aparecem com 500 siclos cada, enquanto canela e cálamo aparecem com 250 siclos cada."}, {"n": 11, "q": "A primeira prensagem das azeitonas produzia um azeite mais puro, utilizado também para fins sagrados.", "a": "V", "e": "O azeite obtido na primeira prensagem possuía maior pureza e era destinado, entre outros usos, ao candelabro e aos óleos sagrados."}, {"n": 12, "q": "A fórmula do óleo santo poderia ser reproduzida livremente para uso pessoal, desde que seus ingredientes fossem mantidos.", "a": "F", "e": "A reprodução daquela composição era proibida. O óleo era santo e destinado especificamente ao propósito estabelecido por Deus."}, {"n": 13, "q": "A principal mudança da Nova Aliança foi o Espírito Santo começar a agir pela primeira vez.", "a": "F", "e": "O Espírito Santo já agia desde Gênesis. A mudança está principalmente no alcance e na permanência de Sua atuação."}, {"n": 14, "q": "Na Nova Aliança, o Espírito Santo habita dentro do crente e também pode vir sobre ele para capacitá-lo ao serviço.", "a": "V", "e": "A presença do Espírito dentro está relacionada à vida do crente, enquanto Sua atuação sobre está relacionada à capacitação para a obra."}, {"n": 15, "q": "Somente pessoas chamadas para um dos cinco dons ministeriais possuem unção na Nova Aliança.", "a": "F", "e": "Todo crente nascido de novo possui a unção interior porque o Espírito Santo habita nele."}, {"n": 16, "q": "Existem três tipos de unção apresentados: individual, ministerial e coletiva.", "a": "V", "e": "A individual permanece no crente, a ministerial capacita para um ofício e a coletiva manifesta-se quando cristãos se reúnem em concordância."}, {"n": 17, "q": "A relação de Jesus com o Espírito Santo começou somente no batismo no rio Jordão.", "a": "F", "e": "Jesus foi concebido pelo Espírito Santo. Sua relação com o Espírito está presente desde Sua concepção."}, {"n": 18, "q": "Jesus iniciou Seu ministério público após Seu batismo, quando o Espírito Santo desceu sobre Ele.", "a": "V", "e": "A descida do Espírito sobre Jesus marcou Sua capacitação pública para o início do ministério."}, {"n": 19, "q": "No batismo de Jesus, Pai, Filho e Espírito Santo se manifestaram de maneira distinta.", "a": "V", "e": "Jesus estava nas águas, o Espírito desceu em forma corpórea e a voz do Pai veio do céu."}, {"n": 20, "q": "O Espírito Santo participou apenas do início do ministério de Jesus, não estando relacionado à Sua morte ou ressurreição.", "a": "F", "e": "Jesus foi guiado pelo Espírito, ofereceu-se pelo Espírito eterno e foi ressuscitado pelo Espírito."}];
const answers = {};

function renderQuiz() {
  const wrap = document.getElementById('quiz');
  wrap.innerHTML = '';

  questions.forEach((item, idx) => {
    const card = document.createElement('section');
    card.className = 'question-card';
    card.innerHTML = `
      <div class="q-index">Questão ${item.n}</div>
      <div class="question-text">${item.q}</div>
      <div class="options">
        <button class="option" data-value="V">Verdadeiro</button>
        <button class="option" data-value="F">Falso</button>
      </div>
      <div class="feedback" id="feedback-${idx}"></div>
    `;

    card.querySelectorAll('.option').forEach(btn => {
      btn.addEventListener('click', () => choose(idx, btn.dataset.value, card));
    });
    wrap.appendChild(card);
  });
  updateStats();
}

function choose(idx, value, card) {
  answers[idx] = value;
  const item = questions[idx];

  card.querySelectorAll('.option').forEach(btn => {
    btn.classList.toggle('selected', btn.dataset.value === value);
  });

  const feedback = card.querySelector('.feedback');
  const correct = value === item.a;
  feedback.className = 'feedback ' + (correct ? 'ok' : 'bad');
  feedback.innerHTML = `<strong>${correct ? 'Correto ✅' : 'Incorreto ❌'}</strong><br>${item.e}`;
  updateStats();
}

function updateStats() {
  const answered = Object.keys(answers).length;
  let hits = 0;
  questions.forEach((q, i) => { if (answers[i] === q.a) hits++; });
  document.getElementById('answered').textContent = answered;
  document.getElementById('hits').textContent = hits;
  document.getElementById('progressBar').style.width = ((answered / questions.length) * 100) + '%';
}

document.getElementById('finishBtn').addEventListener('click', () => {
  let score = 0;
  questions.forEach((q, i) => { if (answers[i] === q.a) score++; });
  const answered = Object.keys(answers).length;
  const pct = Math.round(score / questions.length * 100);

  const result = document.getElementById('result');
  result.style.display = 'block';
  result.innerHTML = `
    <span class="eyebrow">Resultado final</span>
    <h2>Você acertou</h2>
    <div class="score">${score}/20</div>
    <p><strong>${pct}% de aproveitamento</strong><br>Questões respondidas: ${answered} de 20.</p>
    <div class="result-actions">
      <button class="again" onclick="resetQuiz()">Refazer este questionário</button>
      <a class="back" href="questionario2.html">Ir para o próximo questionário</a>
    </div>
  `;
  result.scrollIntoView({behavior:'smooth', block:'center'});
});

function resetQuiz() {
  Object.keys(answers).forEach(k => delete answers[k]);
  document.getElementById('result').style.display = 'none';
  renderQuiz();
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('resetBtn').addEventListener('click', resetQuiz);

renderQuiz();
</script>
</body>
</html>
